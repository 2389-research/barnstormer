{# ABOUTME: One rail row — spec link plus a ⋯ menu (rename / pin / archive). #}
{# ABOUTME: Included by spec_list.html for both the Pinned and Recent groups. #}
<div class="spec-list-item">
    <a class="spec-row-link"
       hx-get="/web/specs/{{ spec.spec_id }}"
       hx-target="#workspace" hx-swap="innerHTML"
       hx-push-url="/web/specs/{{ spec.spec_id }}">
        {% if spec.pinned %}
        <span class="pin-ico" aria-hidden="true"><svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M16 3v2l-1 1v5l3 3v2h-5v6h-2v-6H4v-2l3-3V6L6 5V3z"/></svg></span>
        {% endif %}
        <span class="spec-text">
            <span class="spec-title">{{ spec.title }}</span>
            <span class="one-liner">{{ spec.one_liner }}</span>
        </span>
    </a>
    <details class="spec-menu-wrap">
        <summary class="kebab" aria-label="Spec options"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="12" cy="19" r="1.6"/></svg></summary>
        <div class="spec-menu">
            <button type="button" class="menu-item"
                    hx-get="/web/specs/{{ spec.spec_id }}/rename-form"
                    hx-target="closest .spec-list-item" hx-swap="outerHTML">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>Rename
            </button>
            {% if spec.pinned %}
            <button type="button" class="menu-item"
                    hx-post="/web/specs/{{ spec.spec_id }}/unpin"
                    hx-target="#spec-list" hx-swap="innerHTML">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M16 3v2l-1 1v5l3 3v2h-5v6h-2v-6H4v-2l3-3V6L6 5V3z"/></svg>Unpin
            </button>
            {% else %}
            <button type="button" class="menu-item"
                    hx-post="/web/specs/{{ spec.spec_id }}/pin"
                    hx-target="#spec-list" hx-swap="innerHTML">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M16 3v2l-1 1v5l3 3v2h-5v6h-2v-6H4v-2l3-3V6L6 5V3z"/></svg>Pin
            </button>
            {% endif %}
            <div class="menu-sep"></div>
            <button type="button" class="menu-item"
                    hx-post="/web/specs/{{ spec.spec_id }}/archive"
                    hx-target="#spec-list" hx-swap="innerHTML">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="4" rx="1"/><path d="M5 8v11a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8"/><line x1="10" y1="12" x2="14" y2="12"/></svg>Archive
            </button>
        </div>
    </details>
</div>
